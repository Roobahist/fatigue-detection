name: Research checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout as Zh
        uses: actions/checkout@v4
        with:
          path: Zh

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test dataset path and label utilities
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s Zh/tests -v

      - name: Compile Python sources
        run: python -m compileall -q Zh/src Zh/experiments/e15

      - name: Validate shell syntax
        run: bash -n Zh/src/jobs/submit_job.sh Zh/src/jobs/manage_experiments.sh
